<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ block "title" . }}{{ .Site.Title }}{{ end }}</title>
  <meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}">
  <link rel="alternate" type="application/rss+xml" title="{{ .Site.Title }}" href="{{ "/index.xml" | absURL }}">
  {{ with .Params.summary }}<meta name="description" content="{{ . }}">{{ end }}
  <link rel="stylesheet" href="{{ "/css/site.css" | absURL }}">
  {{ if .IsNode }}<link rel="canonical" href="{{ .Permalink }}">{{ end }}
</head>
<body>
  <header>
    <a href="{{ "/" | absURL }}" class="site-name">{{ .Site.Title }}</a>
    <nav>
      <a href="{{ "/" | absURL }}">Home</a>
      <a href="{{ "/essays/" | absURL }}">Essays</a>
      <a href="{{ "/notes/" | absURL }}">Notes</a>
      <a href="{{ "/about/" | absURL }}">About</a>
      <a href="{{ "/contact/" | absURL }}">Contact</a>
    </nav>
  </header>

  <main>
    {{ block "main" . }}{{ end }}
  </main>

  <footer>
    <p>&copy; {{ now.Year }} {{ .Site.Title }} &middot; <a href="{{ "/index.xml" | absURL }}">RSS</a></p>
  </footer>
</body>
</html>
