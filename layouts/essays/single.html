{{ define "title" }}{{ with .Title }}{{ . }} &middot; {{ end }}{{ .Site.Title }}{{ end }}
{{ define "main" }}
<article class="single-essay">
  <h1>{{ .Title }}</h1>
  <time datetime="{{ .Date.Format "2006-01-02T15:04:05Z07:00" }}">{{ .Date.Format "January 2, 2006" }}</time>
  {{ .Content }}
</article>
{{ end }}
