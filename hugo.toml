baseURL = 'https://mattcope.land/'
locale = 'en-us'
title = 'Matt Copeland'
timezone = 'America/New_York'
enableRobotsTXT = true

[params]
  description = 'Writing and notes from Matt Copeland.'

[outputs]
  home = ['html', 'rss']
  section = ['html', 'rss']

[permalinks]
  # :contentbasename derives the URL from the filename, so every note is
  # unique without needing front matter. :slug is empty for untitled notes,
  # which collapsed every note on a given day onto one colliding URL.
  notes = '/notes/:contentbasename/'
  essays = '/essays/:slug/'

# No taxonomies. An empty table overrides Hugo's tags/categories defaults;
# empty-string values would silently ignore any `tags:` front matter instead.
[taxonomies]

[minify]
  minifyOutput = true

# Where a page's date comes from, in order of precedence:
#   :default  -- the `date` field in front matter, if present
#   :filename -- the YYYY-MM-DD prefix on the filename
# So a note can be a bare .md file with no front matter at all, and an explicit
# date (with a time) still wins when several notes share a day and order matters.
# Essays have no date in their filename, so they do need a `date` in front matter.
[frontmatter]
  date = [':default', ':filename']
